services:
  db:
    image: mariadb:11
    container_name: mini_db
    environment:
      MARIADB_ROOT_PASSWORD: root1234
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - ./dbdata:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    container_name: mini_api

    env_file: .env
    depends_on:
      db:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: mini_web
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  dbdata:
